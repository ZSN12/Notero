[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: Fast unit tests with no external dependencies
    integration: Tests that hit the database or external services via mocks
    slow: Tests that are slow due to I/O, audio processing, or heavy computation
    llm: Tests that require or mock LLM providers
    e2e: End-to-end tests across multiple components or real file uploads
filterwarnings =
    ignore::DeprecationWarning
