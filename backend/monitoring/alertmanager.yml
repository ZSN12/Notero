# Notero Alertmanager configuration
# Place this file at /etc/alertmanager/alertmanager.yml (or mount via Docker)
#
# Routes alerts to different receivers based on severity.
# Critical alerts → immediate notification (e.g. PagerDuty/Slack)
# Warning alerts → daily digest

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@notero.local'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 12h

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#notero-alerts'
        title: 'Notero Alert: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: 'critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#notero-critical'
        send_resolved: true
        title: '🔴 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >
          {{ range .Alerts }}
          *Instance:* {{ .Labels.instance }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
    email_configs:
      - to: 'oncall@notero.local'
        subject: '[CRITICAL] Notero: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}

  - name: 'warning'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#notero-warnings'
        send_resolved: false
        title: '🟡 Warning: {{ .GroupLabels.alertname }}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'
